<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No man is an island</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1033;
    color: #e8eef5;
    font-family: system-ui, sans-serif;
    text-align: center;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    flex: 1 1 auto;
    min-height: 220px;
    background: #0d1033;
  }
  h3 {
    margin: 0.55rem 0 0.15rem;
    font-family: Alegreya, Georgia, serif;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #B9D9EB;
  }
  .ctl {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    font: 12px ui-monospace, monospace;
    padding: 8px 12px 16px;
    color: #B9D9EB;
  }
  input[type=range] {
    width: 220px;
    touch-action: none;
    accent-color: #B9D9EB;
  }
  output {
    min-width: 90px;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 700;
  }
</style>
<canvas id="c"></canvas>
<h3>No man is an island</h3>
<div class="ctl">
  <label for="friends">Connections</label>
  <input type="range" id="friends" min="0" max="40" value="20" step="1">
  <output id="verdict"></output>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var isZh = /(?:^|[?&])lang=zh(?:&|$)/.test(location.search);
if (isZh) {
  document.title = "人不是孤岛";
  document.querySelector("h3").textContent = "人不是孤岛";
  document.querySelector("label[for=friends]").textContent = "连接";
}

// ---------- three.js setup ----------
var canvas = document.getElementById("c");
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.z = 4.2;
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setClearColor(0x0d1033, 1);
scene.add(new THREE.AmbientLight(0xB9D9EB, 0.55));
var key = new THREE.PointLight(0xe8eef5, 0.9, 40, 1.6);
key.position.set(-1, 1.5, 3); scene.add(key);
var fill = new THREE.PointLight(0x1D4F91, 0.5, 40, 1.8);
fill.position.set(1.4, -0.8, 2.2); scene.add(fill);

// ---------- the model ----------
// One person in the middle, a room of people around her. Meeting someone adds
// a tie to her and up to two ties to friends already met. Everyone has a
// baseline mood. Support from neighbours lifts it with diminishing returns,
// and a lifted friend gives more back. Iterate until it settles.
var N = 46, ME = 0, BETA = 0.20, GAMMA = 0.10, ROUNDS = 40;
function rng(seed){ return function(){ seed = (seed*1664525+1013904223) % 4294967296; return seed/4294967296; }; }
var rnd = rng(20260907), pos = [new THREE.Vector3(0,0,0)], base = [0.12], i, j, k;
for (i = 1; i < N; i++) {                       // points on a squashed ball, none too close to the middle
  var u = rnd()*2-1, th = rnd()*Math.PI*2, r = 0.34 + 0.66*Math.pow(rnd(), 0.55);
  var sq = Math.sqrt(1-u*u);
  pos.push(new THREE.Vector3(r*sq*Math.cos(th)*1.28, r*u*0.86, r*sq*Math.sin(th)*1.28));
  base.push(0.32 + 0.36*rnd());                 // strangers start in a middling mood, she starts low
}
var order = []; for (i = 1; i < N; i++) order.push(i);   // the fixed order in which people are met
var sr = rng(99137);
for (i = order.length-1; i > 0; i--){ var q = Math.floor(sr()*(i+1)), t = order[i]; order[i] = order[q]; order[q] = t; }

function simulate(count) {
  var known = new Array(N), adj = [], m = base.slice(), edges = [];
  for (i = 0; i < N; i++) { known[i] = false; adj.push([]); }
  known[ME] = true;
  var met = order.slice(0, count);
  for (i = 0; i < met.length; i++) known[met[i]] = true;
  function tie(a, b) {
    if (adj[a].indexOf(b) >= 0) return;
    adj[a].push(b); adj[b].push(a); edges.push([a, b]);
  }
  for (i = 0; i < met.length; i++) {
    var f = met[i]; tie(ME, f);
    var d = [];                                  // each friend also supports the two friends nearest to them
    for (j = 0; j < met.length; j++) if (met[j] !== f) d.push([pos[f].distanceToSquared(pos[met[j]]), met[j]]);
    d.sort(function(a,b){ return a[0]-b[0]; });
    for (k = 0; k < 2 && k < d.length; k++) tie(f, d[k][1]);
  }
  for (var rd = 0; rd < ROUNDS; rd++) {
    var next = m.slice();
    // warmth of the whole circle: the bigger and happier the group, the more everyone in it gets back
    var sum = 0; for (j = 0; j < met.length; j++) sum += m[met[j]];
    var warmth = met.length ? (sum / met.length) * Math.pow(met.length, 1.3) : 0;
    for (i = 0; i < N; i++) {
      if (!known[i]) continue;
      var got = GAMMA * warmth;
      for (j = 0; j < adj[i].length; j++) got += m[adj[i][j]];
      next[i] = base[i] + (1 - base[i]) * (1 - Math.exp(-BETA * got));   // saturating lift toward 1
    }
    m = next;
  }
  return { known: known, mood: m, edges: edges };
}

// ---------- bodies: stars, moons, planets (some with rings) ----------
function crateredGeo(seed) {
  var geo = new THREE.SphereGeometry(1, 18, 14);
  var attr = geo.attributes.position, r = rng(seed);
  for (var v = 0; v < attr.count; v++) {
    var x = attr.getX(v), y = attr.getY(v), z = attr.getZ(v);
    var len = Math.sqrt(x * x + y * y + z * z) || 1;
    var dent = 1 - Math.pow(r(), 4) * 0.22;
    attr.setXYZ(v, (x / len) * dent, (y / len) * dent, (z / len) * dent);
  }
  geo.computeVertexNormals();
  return geo;
}

function bandTexture(hexA, hexB, seed) {
  var c = document.createElement("canvas");
  c.width = 64; c.height = 64;
  var ctx = c.getContext("2d"), r = rng(seed);
  function css(hex) {
    return "#" + ("000000" + hex.toString(16)).slice(-6);
  }
  for (var y = 0; y < 64; ) {
    var h = 1 + (r() * 4 | 0);
    ctx.fillStyle = r() > 0.42 ? css(hexA) : css(hexB);
    ctx.fillRect(0, y, 64, h);
    y += h;
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.needsUpdate = true;
  return tex;
}

function stdMat(tint, extra) {
  var m = new THREE.MeshStandardMaterial({
    color: tint, emissive: tint, emissiveIntensity: 0.2,
    roughness: 0.5, metalness: 0.12
  });
  if (extra) Object.keys(extra).forEach(function(k){ m[k] = extra[k]; });
  return m;
}

function makeStar(tint) {
  var g = new THREE.Group();
  var core = stdMat(tint, { roughness: 0.22, metalness: 0, emissiveIntensity: 1.15 });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), core));
  var spike = new THREE.MeshBasicMaterial({
    color: tint, transparent: true, opacity: 0.88, depthWrite: false
  });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.07, 0.07), spike));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 2.8, 0.07), spike));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 2.8), spike));
  return { group: g, mats: [core, spike], glowMul: 1.25 };
}

function makeMoon(tint, seed) {
  var g = new THREE.Group();
  var mat = stdMat(tint, { roughness: 0.94, metalness: 0.02, emissiveIntensity: 0.12 });
  g.add(new THREE.Mesh(crateredGeo(seed), mat));
  g.rotation.set((rnd() - 0.5) * 0.8, 0, (rnd() - 0.5) * 0.8);
  return { group: g, mats: [mat], glowMul: 0.45 };
}

function makePlanet(tint, seed, ringed) {
  var g = new THREE.Group();
  var extra = { roughness: 0.48, metalness: 0.16, emissiveIntensity: 0.28 };
  if (ringed || rnd() > 0.55) extra.map = bandTexture(tint, 0xB9D9EB, seed);
  var mat = stdMat(tint, extra);
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat));
  var mats = [mat];
  var atmo = new THREE.MeshBasicMaterial({
    color: 0xB9D9EB, transparent: true, opacity: 0.14, side: THREE.BackSide, depthWrite: false
  });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1.08, 20, 16), atmo));
  mats.push(atmo);
  if (ringed) {
    var ringMat = stdMat(0xB9D9EB, {
      roughness: 0.62, metalness: 0.08, emissiveIntensity: 0.22,
      side: THREE.DoubleSide, transparent: true, opacity: 0.78
    });
    var ring = new THREE.Mesh(new THREE.RingGeometry(1.35, 2.1, 48), ringMat);
    ring.rotation.x = Math.PI / 2.2;
    g.add(ring);
    mats.push(ringMat);
  }
  g.rotation.set((rnd() - 0.5) * 0.5, 0, (rnd() - 0.5) * 0.6);
  return { group: g, mats: mats, glowMul: 0.7 };
}

var STAR_TINTS = [0xFFFFFF, 0xe8eef5, 0xB9D9EB];
var PLANET_TINTS = [0x181C62, 0x1D4F91, 0x5d86aa, 0xB9D9EB];
var MOON_TINTS = [0x7a8494, 0x8a92a8, 0x5c6b7a];

var net = new THREE.Group(); scene.add(net);
var bodies = [], br = rng(44117);
for (i = 0; i < N; i++) {
  var kind, tint, built, scale;
  if (i === ME) {
    built = makeStar(0xFFFFFF);
    scale = 0.070;
  } else {
    var roll = br();
    if (roll < 0.26) {
      tint = STAR_TINTS[(br() * STAR_TINTS.length) | 0];
      built = makeStar(tint);
      scale = 0.018 + br() * 0.012;
    } else if (roll < 0.52) {
      tint = MOON_TINTS[(br() * MOON_TINTS.length) | 0];
      built = makeMoon(tint, (br() * 1e9) | 0);
      scale = 0.026 + br() * 0.014;
    } else if (roll < 0.82) {
      tint = PLANET_TINTS[(br() * PLANET_TINTS.length) | 0];
      built = makePlanet(tint, (br() * 1e9) | 0, false);
      scale = 0.034 + br() * 0.016;
    } else {
      tint = PLANET_TINTS[(br() * PLANET_TINTS.length) | 0];
      built = makePlanet(tint, (br() * 1e9) | 0, true);
      scale = 0.036 + br() * 0.014;
    }
  }
  built.group.position.copy(pos[i]);
  built.tint = built.mats[0].color.clone();
  built.scale = scale;
  built.spin = (br() - 0.5) * 0.35;
  net.add(built.group);
  bodies.push(built);
}

var MAXE = N * 12, lineGeo = new THREE.BufferGeometry();
var lp = new Float32Array(MAXE * 6), lc = new Float32Array(MAXE * 6);
lineGeo.setAttribute("position", new THREE.BufferAttribute(lp, 3));
lineGeo.setAttribute("color", new THREE.BufferAttribute(lc, 3));
net.add(new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.72 })));

var TIERS = isZh ? [
  { word: "疲惫",    hex: 0x181C62, css: "#8A92D0", glow: 0.35 },
  { word: "撑着",    hex: 0x1D4F91, css: "#7BA3D4", glow: 0.60 },
  { word: "轻松些",  hex: 0xB9D9EB, css: "#B9D9EB", glow: 0.90 },
  { word: "明亮",    hex: 0xFFFFFF, css: "#F4F7FF", glow: 1.30 }
] : [
  { word: "drained",    hex: 0x181C62, css: "#8A92D0", glow: 0.35 },
  { word: "getting by", hex: 0x1D4F91, css: "#7BA3D4", glow: 0.60 },
  { word: "lighter",    hex: 0xB9D9EB, css: "#B9D9EB", glow: 0.90 },
  { word: "bright",     hex: 0xFFFFFF, css: "#F4F7FF", glow: 1.30 }
];
function tier(mood) { return mood < 0.3 ? 0 : mood < 0.55 ? 1 : mood < 0.8 ? 2 : 3; }
var TIER_COLORS = TIERS.map(function(t){ return new THREE.Color(t.hex); });
var STRANGER = new THREE.Color(0x1a2258), TIE_LOW = new THREE.Color(0x1D4F91), TIE_HIGH = new THREE.Color(0xB9D9EB), cc = new THREE.Color(), tmp = new THREE.Color();

function paint(res) {
  for (var n = 0; n < N; n++) {
    var b = bodies[n], known = res.known[n], tr = TIERS[tier(res.mood[n])];
    var glow = known ? tr.glow * b.glowMul : 0.10 * b.glowMul;
    if (!known) tmp.copy(STRANGER).lerp(b.tint, 0.28);
    else tmp.copy(b.tint).lerp(TIER_COLORS[tier(res.mood[n])], 0.28);
    for (var mi = 0; mi < b.mats.length; mi++) {
      var mat = b.mats[mi];
      if (mat.emissive) {
        mat.color.copy(tmp);
        mat.emissive.copy(tmp);
        mat.emissiveIntensity = glow;
      } else {
        mat.color.copy(tmp);
      }
      if (mat.transparent && mat.opacity !== undefined && mi === 1 && b.glowMul > 1) {
        mat.opacity = known ? 0.45 + glow * 0.35 : 0.12;
      }
    }
    b.group.scale.setScalar(b.scale * (known ? 1 : 0.78));
  }
  for (var q = 0; q < res.edges.length; q++) {
    var a = res.edges[q][0], b2 = res.edges[q][1];
    lp.set([pos[a].x, pos[a].y, pos[a].z, pos[b2].x, pos[b2].y, pos[b2].z], q * 6);
    cc.copy(TIE_LOW).lerp(TIE_HIGH, Math.min(tier(res.mood[a]), tier(res.mood[b2])) / 3);
    lc.set([cc.r, cc.g, cc.b, cc.r, cc.g, cc.b], q * 6);
  }
  lineGeo.setDrawRange(0, res.edges.length * 2);
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
}

var slider = document.getElementById("friends"), verdict = document.getElementById("verdict");
function run(count) {
  var res = simulate(count); paint(res);
  var tr = TIERS[tier(res.mood[ME])];
  verdict.textContent = tr.word; verdict.style.color = tr.css;
}
slider.addEventListener("input", function(){ run(+slider.value); });
run(+slider.value);

// ---------- frame loop ----------
function fit() {
  var w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", fit); fit();
var t0 = performance.now();
(function frame(now) {
  var t = (now - t0) / 1000;
  net.rotation.y = t * 0.16; net.rotation.x = Math.sin(t * 0.21) * 0.14;
  for (var n = 0; n < N; n++) bodies[n].group.rotation.y += bodies[n].spin * 0.016;
  renderer.render(scene, camera); requestAnimationFrame(frame);
})(t0);
</script>
